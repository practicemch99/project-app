name: project-local
services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy .env.example to .env}
      MYSQL_DATABASE: appdb
      TZ: Asia/Seoul
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+09:00"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./local/mysql/init.sql:/docker-entrypoint-initdb.d/01-users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h 127.0.0.1 -u root -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql-data:
