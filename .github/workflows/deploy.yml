name: Build & Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  NAME: learning-dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Build JARs
        run: ./gradlew assemble

      - name: Debug OIDC token claims
        continue-on-error: true
        run: |
          echo "URL set: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo YES || echo NO)"
          echo "TOKEN set: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo YES || echo NO)"
          RESPONSE=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          echo "response: $RESPONSE" | head -c 500
          TOKEN=$(echo "$RESPONSE" | jq -r '.value // empty')
          if [ -n "$TOKEN" ]; then
            PART=$(echo "$TOKEN" | cut -d. -f2 | tr -- '-_' '+/')
            PAD=$(( 4 - ${#PART} % 4 )); [ $PAD -ne 4 ] && PART="${PART}$(printf '=%.0s' $(seq 1 $PAD))"
            echo "$PART" | base64 -d 2>/dev/null | jq '{sub,aud}' || echo "decode failed"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR login
        run: |
          aws ecr get-login-password --region $AWS_REGION \
            | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

      - name: Build & Push images
        run: |
          TAG=${{ github.sha }}
          REGISTRY=${{ secrets.ECR_REGISTRY }}
          for svc in user-service core-service batch-service database-migration; do
            docker build -t $REGISTRY/$NAME/$svc:$TAG ./$svc
            docker push $REGISTRY/$NAME/$svc:$TAG
          done

      - name: Deploy via SSM
        run: |
          TAG=${{ github.sha }}
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"bash /opt/app/deploy.sh $TAG\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text
