spring:
  application:
    name: user-service
server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: true
core:
  base-url: ${CORE_BASE_URL}
management:
  endpoints:
    web:
      exposure:
        include: health,info
